name: keepalive
# Acorda o servidor gratuito da Render a cada 10 min e dispara as rotinas diárias (backup e avisos de vencimento).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --max-time 60 https://app.kattalo.online/healthz
